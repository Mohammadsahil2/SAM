<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>SAM – Tune Your Mind</title>

<link rel="stylesheet" href="style.css">

<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

</head>

<body>

<div id="app">

<header>
<h1>SAM</h1>
<p>Your AI Mind Companion</p>
</header>

<section class="companion">

<div id="avatar"></div>

<div id="samText">
Hello. I'm SAM. How are you feeling today?
</div>

<button onclick="startListening()">🎙 Talk to SAM</button>

</section>

<section class="controls">

<h2>Quick Sessions</h2>

<div class="buttons">

<button onclick="startSession('focus')">Focus</button>
<button onclick="startSession('relax')">Relax</button>
<button onclick="startSession('creative')">Creative</button>
<button onclick="startSession('sleep')">Sleep</button>

</div>

<label>Session Length</label>
<input id="sessionLength" type="number" value="10">

<button onclick="stopSession()">Stop Session</button>

</section>

<section>

<h2>Pomodoro</h2>

<button onclick="startPomodoro()">Start Pomodoro</button>

<p id="pomodoroStatus"></p>

</section>

<section>

<h2>Progress</h2>

<canvas id="chart"></canvas>

</section>

<canvas id="visuals"></canvas>

</div>

<script src="script.js"></script>

</body>
</html>
