<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>SAM – Tune Your Mind</title>

<link rel="stylesheet" href="style.css">

<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

</head>

<body>

<header>

<h1>SAM</h1>
<p>Your AI Mind Companion</p>

</header>

<section id="companion">

<div id="avatar"></div>

<div id="samText">

Hello. I'm SAM. How can I help you today?

</div>

<button onclick="startListening()">🎙 Talk to SAM</button>

</section>

<section id="sessions">

<h2>Sessions</h2>

<button onclick="startSession('focus')">Focus</button>
<button onclick="startSession('relax')">Relax</button>
<button onclick="startSession('creative')">Creative</button>
<button onclick="startSession('sleep')">Sleep</button>

<input type="number" id="sessionLength" value="10">

<button onclick="stopSession()">Stop</button>

</section>

<section>

<h2>Pomodoro</h2>

<button onclick="startPomodoro()">Start Pomodoro</button>

<p id="pomodoroStatus"></p>

</section>

<section>

<h2>Progress</h2>

<canvas id="progressChart"></canvas>

</section>

<canvas id="visuals"></canvas>

<script src="script.js"></script>

</body>
</html>
