<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SAM – Tune Your Mind</title>

<link rel="stylesheet" href="style.css">

<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<link rel="manifest" href="manifest.json">

</head>
<body>

<header>
<h1>SAM</h1>
<p>Your AI Mind Companion</p>
</header>

<section class="controls">

<h2>Choose Mood</h2>

<div class="moods">
<button onclick="startSession('focus')">🎯 Focus</button>
<button onclick="startSession('relax')">😌 Relax</button>
<button onclick="startSession('creative')">🎨 Creative</button>
<button onclick="startSession('sleep')">😴 Sleep</button>
</div>

<label>Session Length (minutes)</label>
<input type="number" id="sessionLength" value="10">

<div class="sessionButtons">
<button onclick="stopSession()">Stop Session</button>
<button onclick="enableVoice()">🎙 Talk to SAM</button>
</div>

</section>

<section>

<h2>Pomodoro</h2>
<button onclick="startPomodoro()">Start Pomodoro</button>
<p id="pomodoroStatus"></p>

</section>

<section>

<h2>SAM Companion</h2>
<div id="samChat"></div>

</section>

<section>

<h2>Your Progress</h2>
<canvas id="progressChart"></canvas>

</section>

<canvas id="visualCanvas"></canvas>

<script src="script.js"></script>

</body>
</html>
